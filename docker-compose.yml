services:
  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - dokploy-network
    volumes:
      - laravel_storage:/var/www/html/storage
      - laravel_logs:/var/www/html/storage/logs
      - laravel_db:/var/www/html/database
    environment:
      - APP_NAME=${APP_NAME:-KonnektVPN}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-https://konnekt-1.xyz}
      - APP_LOCALE=${APP_LOCALE:-ru}
      - APP_FALLBACK_LOCALE=${APP_FALLBACK_LOCALE:-en}
      - LOG_CHANNEL=stack
      - LOG_LEVEL=info
      - DB_CONNECTION=sqlite
      # Legacy 3x-ui env — used as a fallback by ServerSeeder when SERVERS_JSON is empty.
      - XUI_HOST=${XUI_HOST:-3x-ui}
      - XUI_PORT=${XUI_PORT:-2053}
      - XUI_PATH=${XUI_PATH:-}
      - XUI_USERNAME=${XUI_USERNAME}
      - XUI_PASSWORD=${XUI_PASSWORD}
      - XUI_INBOUND_ID=${XUI_INBOUND_ID:-1}
      # Telegram
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      # Mini App
      - MINIAPP_APP_URL=${MINIAPP_APP_URL:-${APP_URL:-https://konnekt-1.xyz}}
      - MINIAPP_SUPPORT_URL=${MINIAPP_SUPPORT_URL}
      - MINIAPP_INIT_DATA_TTL=${MINIAPP_INIT_DATA_TTL:-86400}
      # Multi-server registry (JSON array; see config/servers.php for shape).
      - SERVERS_JSON=${SERVERS_JSON:-}
      # Domain
      - VPN_PRIMARY_DOMAIN=${VPN_PRIMARY_DOMAIN:-konnekt-1.xyz}
      - VPN_PANEL_DOMAIN=${VPN_PANEL_DOMAIN:-dashboard.konnekt-1.xyz}
      - VPN_SUBSCRIPTION_PORT=${VPN_SUBSCRIPTION_PORT:-2096}
    depends_on:
      - 3x-ui
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  3x-ui:
    # Pinned tag — stops `:latest` drift from silently changing API field names.
    image: ghcr.io/mhsanaei/3x-ui:v2.5.0
    restart: unless-stopped
    tty: true
    networks:
      - dokploy-network
    volumes:
      - xui_db:/etc/x-ui
      - xui_certs:/root/cert
    environment:
      - XRAY_VMESS_AEAD_FORCED=false
    ports:
      - "8443:8443"
      - "2096:2096"

volumes:
  laravel_storage:
  laravel_logs:
  laravel_db:
  xui_db:
  xui_certs:

networks:
  dokploy-network:
    external: true
