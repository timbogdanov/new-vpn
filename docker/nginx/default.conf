# Trust Docker/Traefik networks and set real IP from X-Forwarded-For
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Proxy the 3x-ui subscription server behind the primary domain's TLS.
    # The panel's subscription listener is HTTP-only on :2096; iOS URLSession
    # requires HTTPS with a valid cert, which Dokploy/Traefik provides on 443.
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Laravel's aggregated, multi-server subscription lives at /sub/u/{token}
    # and MUST reach PHP — not the 3x-ui proxy below. `^~` outranks the plain
    # `/sub/` prefix and skips regex locations, so this wins. A 3x-ui per-client
    # sub_id is a single path segment that never starts with "u/", so the
    # per-server /sub/{sub_id} path still falls through to the proxy.
    # NOTE: if Dokploy/Traefik path-routes /sub/* straight to the 3x-ui service
    # instead of through this nginx, replicate this as a higher-priority Traefik
    # rule: PathPrefix(`/sub/u/`) -> laravel, above the /sub/ -> 3x-ui rule.
    location ^~ /sub/u/ {
        try_files $uri /index.php?$query_string;
    }

    location /sub/ {
        set $xui_sub http://3x-ui:2096;
        proxy_pass $xui_sub$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
}
