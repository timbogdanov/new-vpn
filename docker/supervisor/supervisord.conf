[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:startup]
command=/bin/sh -c "sleep 5 && mkdir -p /var/www/html/database/migrations /var/www/html/database/seeders && cp -rn /opt/laravel-stash-migrations/. /var/www/html/database/migrations/ && cp -rn /opt/laravel-stash-seeders/. /var/www/html/database/seeders/ && chown -R www-data:www-data /var/www/html/database/migrations /var/www/html/database/seeders && php /var/www/html/artisan migrate --force && php /var/www/html/artisan db:seed --class=ServerSeeder --force && php /var/www/html/artisan telegram:set-webhook && php /var/www/html/artisan telegram:set-menu-button && php /var/www/html/artisan config:cache && php /var/www/html/artisan route:cache"
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/bin/sh -c "while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction >> /dev/null 2>&1; sleep 60; done"
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
